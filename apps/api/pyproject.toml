[project]
name = "pedrocore-ia-api"
version = "0.2.0"
description = "API multi-provider do PedroCore IA"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "google-genai>=0.8.0",
    "openai>=1.60.0",
    "anthropic>=0.45.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

# Descoberta explicita de pacotes.
#
# Sem isto o setuptools encontra `app` e `migrations` no mesmo nivel e recusa
# adivinhar qual e o pacote — o que fazia `pip install -e .` falhar, inclusive
# no passo de instalacao da CI. `migrations` sao arquivos SQL aplicados por um
# runner, nao um pacote Python, e `tests` nao e distribuido.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
