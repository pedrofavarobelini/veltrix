[project]
name = "veltrix-api"
version = "0.2.0"
description = "Veltrix — AI Runtime & Learning Control Plane"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "google-genai>=0.8.0",
    "openai>=1.60.0",
    "anthropic>=0.45.0",
    "psycopg[binary]>=3.2",
]

# O Risk Console e uma TUI local: o container da API nao precisa dela, e quem
# so quer analisar risco no terminal nao precisa do ferramental de teste. Por
# isso `console` e um extra, e o grupo `dev` referencia o proprio extra para
# que exista UMA fonte de verdade da versao do Textual.
[project.optional-dependencies]
console = [
    "textual>=1.0.0,<7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "veltrix-api[console]",
]

# `veltrix` e o comando canonico; `pedrocore` continua existindo como alias
# legado para nao quebrar script, atalho e documentacao de quem ja usava. Os
# dois apontam para o mesmo ponto de entrada — nao ha duas implementacoes.
[project.scripts]
veltrix = "app.modules.risk_console.cli:main"
pedrocore = "app.modules.risk_console.cli:main"

# Descoberta explicita de pacotes.
#
# Sem isto o setuptools encontra `app` e `migrations` no mesmo nivel e recusa
# adivinhar qual e o pacote — o que fazia `pip install -e .` falhar, inclusive
# no passo de instalacao da CI. `migrations` sao arquivos SQL aplicados por um
# runner, nao um pacote Python, e `tests` nao e distribuido.
# Sem backend de build declarado, o `uv sync` instalava as dependencias mas
# pulava `[project.scripts]` com o aviso "this project is not packaged" — e o
# comando `pedrocore` nunca aparecia no PATH do venv. Declarar o backend que o
# projeto ja usava implicitamente e o que faz o ponto de entrada existir.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
