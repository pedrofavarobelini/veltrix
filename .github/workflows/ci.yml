# Verificação contínua do PedroCore IA.
#
# Roda exatamente os mesmos comandos documentados em CONTRIBUTING.md — se a CI
# e a instrução local divergirem, uma das duas está mentindo.
#
# Nenhum provider real é chamado. Todos os opt-in (`PEDROCORE_RUN_REAL_*`)
# permanecem no default `false`, e a suíte não tem acesso a chave alguma.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Um push novo cancela a execução anterior do mesmo ref: gastar runner
# validando um commit que já foi substituído não ajuda ninguém.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — testes, lint e grafo documental
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # O projeto declara as dependencias de desenvolvimento em
      # `[dependency-groups]` (PEP 735) e mantem `uv.lock` — nao ha
      # `[project.optional-dependencies]`. `pip install -e ".[dev]"` procurava um
      # extra que nao existe, avisava `does not provide the extra 'dev'` e seguia
      # sem instalar ruff nem pytest; o job entao falhava no lint e nunca chegava
      # aos testes. `uv sync` instala a partir do lock, que e a mesma fonte que o
      # Dependabot atualiza — uma fonte de verdade, nao duas.
      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependências (a partir do uv.lock)
        working-directory: apps/api
        run: uv sync --frozen

      - name: Ruff
        working-directory: apps/api
        run: uv run --frozen python -m ruff check .

      - name: Suíte de testes
        working-directory: apps/api
        # Os 30 skips são esperados: 22 exigem PostgreSQL de teste e 8 são
        # opt-in de recurso real. `-rs` os lista para que um skip NOVO fique
        # visível no log em vez de passar despercebido.
        #
        # Os 22 de PostgreSQL foram executados contra banco real no fechamento
        # do Risk Engine V2; aqui continuam `skip` porque a CI não provisiona
        # banco — um skip é honesto, um PASS sem banco não seria.
        run: uv run --frozen python -m pytest -q -rs

      - name: Grafo documental
        working-directory: apps/api
        run: |
          uv run --frozen python -c "
          from app.modules.docs_graph.service import build_graph
          report = build_graph()
          print(report.render())
          raise SystemExit(0 if report.ok else 1)
          "

  frontend:
    name: Frontend — typecheck e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependências
        working-directory: apps/web
        run: npm ci

      - name: Auditoria de dependências
        working-directory: apps/web
        # Só produção: vulnerabilidade em ferramenta de build não é a mesma
        # coisa que vulnerabilidade no que vai para o navegador.
        run: npm audit --omit=dev --audit-level=high

      # A suite de frontend chegou com a frente de UX V1 (117 testes). Sem este
      # passo a CI diria "typecheck e build" e deixaria de fora a unica camada
      # que verifica comportamento de interface.
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Testes de frontend
        working-directory: apps/web
        run: npm test

      - name: Build
        working-directory: apps/web
        run: npm run build
